apiVersion: v1
kind: Service
metadata:
  name: poi-io-headless
  namespace: poi
  labels:
    app: poi-io
    app.kubernetes.io/name: poi-io-headless
    app.kubernetes.io/part-of: poi-stack
spec:
  clusterIP: None
  selector:
    app: poi-io
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: poi-io-service
  namespace: poi
  labels:
    app: poi-io
    app.kubernetes.io/name: poi-io-service
    app.kubernetes.io/part-of: poi-stack
spec:
  type: NodePort
  selector:
    app: poi-io
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30082
      protocol: TCP
