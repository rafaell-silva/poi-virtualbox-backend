apiVersion: apps/v1
kind: Deployment
metadata:
  name: poi-memory
  namespace: poi
  labels:
    app: poi-memory
    app.kubernetes.io/name: poi-memory
    app.kubernetes.io/component: workload-memory
    app.kubernetes.io/part-of: poi-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: poi-memory
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: poi-memory
        app.kubernetes.io/name: poi-memory
        app.kubernetes.io/component: workload-memory
        app.kubernetes.io/part-of: poi-stack
    spec:
      containers:
        - name: poi-memory
          image: rafaellsb/poi-memory-bound:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: WORKERS
              value: "1"
            - name: MAX_CONCURRENT_MIB
              value: "512"
            - name: DEFAULT_SIZE_MIB
              value: "8"
            - name: DEFAULT_DWELL_MS
              value: "200"
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
