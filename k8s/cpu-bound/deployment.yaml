apiVersion: apps/v1
kind: Deployment
metadata:
  name: poi-cpu
  namespace: poi
  labels:
    app: poi-cpu
    app.kubernetes.io/name: poi-cpu
    app.kubernetes.io/component: workload-cpu
    app.kubernetes.io/part-of: poi-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: poi-cpu
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: poi-cpu
        app.kubernetes.io/name: poi-cpu
        app.kubernetes.io/component: workload-cpu
        app.kubernetes.io/part-of: poi-stack
    spec:
      containers:
        - name: poi-cpu
          image: rafaellsb/poi-cpu-bound:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: WORKERS
              value: "1"
            - name: DEFAULT_INTENSITY
              value: "1000"
            - name: DEFAULT_CHUNK_KIB
              value: "64"
            - name: APP_VERSION
              value: "v1-k8s"
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
