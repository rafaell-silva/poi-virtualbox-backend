# /etc/logrotate.d/poi — evita que os logs no volume de 1 GB cresçam sem limite.
#
# Instalação manual (dentro da VM):
#   sudo cp logrotate-poi.conf /etc/logrotate.d/poi
#   sudo logrotate -d /etc/logrotate.d/poi   # dry-run
#
# copytruncate é usado porque o systemd mantém o arquivo aberto com
# StandardOutput=append:. Sem ele, o logrotate renomearia o arquivo e o serviço
# continuaria escrevendo no descritor antigo.

/mnt/poi-data/logs/*.log {
    daily
    rotate 7
    size 50M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

/mnt/poi-data/logs/nginx/*.log {
    daily
    rotate 7
    size 50M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
