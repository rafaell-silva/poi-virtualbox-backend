# nginx-poi.conf — expõe as três aplicações na mesma VM atrás do LB.
#
# Instalação (manual, dentro da VM):
#   sudo cp nginx-poi.conf /etc/nginx/sites-available/poi
#   sudo ln -sf /etc/nginx/sites-available/poi /etc/nginx/sites-enabled/poi
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo mkdir -p /mnt/poi-data/logs/nginx
#   sudo nginx -t && sudo systemctl reload nginx
#
# O LB poi-atividades encaminha HTTP/80 para esta VM:80. O health check do LB
# deve apontar para /health (resposta 200), não para /health de uma app.

upstream poi_cpu {
    server 127.0.0.1:8000;
}

upstream poi_memory {
    server 127.0.0.1:8001;
}

upstream poi_io {
    server 127.0.0.1:8002;
}

server {
    listen 80;
    server_name _;

    access_log /mnt/poi-data/logs/nginx/access.log;
    error_log  /mnt/poi-data/logs/nginx/error.log warn;

    client_max_body_size 2m;

    # Health check do balanceador (não depende de nenhuma app).
    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Prefixos usados pelo k6/run_experiment: http://LB/cpu, /memory, /io.
    location = /cpu    { return 301 /cpu/; }
    location = /memory { return 301 /memory/; }
    location = /io     { return 301 /io/; }

    location /cpu/ {
        proxy_pass http://poi_cpu/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }

    location /memory/ {
        proxy_pass http://poi_memory/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }

    location /io/ {
        proxy_pass http://poi_io/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # fsync + leitura podem demorar em volume de nuvem.
        proxy_read_timeout 300s;
    }
}
