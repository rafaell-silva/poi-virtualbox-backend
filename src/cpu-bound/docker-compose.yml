services:
  poi-cpu:
    image: rafaellsb/poi-cpu-bound:latest
    build: ./app
    container_name: poi-cpu
    hostname: poi-cpu-container
    ports:
      - "8000:8000"
    environment:
      - WORKERS=${WORKERS:-1}
      - DEFAULT_INTENSITY=1000
      - DEFAULT_CHUNK_KIB=64
    restart: unless-stopped

